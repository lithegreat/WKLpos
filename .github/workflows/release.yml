name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Package
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Extract Tag & Version
        id: version_info
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $cleanVersion = $tag.TrimStart('v', 'V')
          if ([string]::IsNullOrWhiteSpace($cleanVersion)) {
              $cleanVersion = "1.0.0"
          }
          Write-Host "Triggered by tag: $tag"
          Write-Host "Parsed Version: $cleanVersion"
          "TAG=$tag" >> $env:GITHUB_ENV
          "VERSION=$cleanVersion" >> $env:GITHUB_ENV

      - name: Run Packaging Script
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\installer\build_installer.ps1 -Version "${{ env.VERSION }}"

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          name: "万客隆 POS 系统 ${{ env.TAG }}"
          tag_name: ${{ env.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            output_installer/WanKePos_Setup_v${{ env.VERSION }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
