name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Package
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache Inno Setup
        id: cache-innosetup
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\Inno Setup 6
          key: ${{ runner.os }}-innosetup-6

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
              Write-Host "Inno Setup 未命中缓存，开始安装..." -ForegroundColor Yellow
              choco install innosetup --no-progress -y
          } else {
              Write-Host "Inno Setup 已从缓存还原，跳过重复安装。" -ForegroundColor Green
          }

      - name: Extract Tag & Version
        id: version_info
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $cleanVersion = $tag.TrimStart('v', 'V')
          if ([string]::IsNullOrWhiteSpace($cleanVersion)) {
              $cleanVersion = "1.0.0"
          }
          Write-Host "Triggered by tag: $tag"
          Write-Host "Parsed Version: $cleanVersion"
          "TAG=$tag" >> $env:GITHUB_ENV
          "VERSION=$cleanVersion" >> $env:GITHUB_ENV

      - name: Run Unit Tests
        run: dotnet test tests/WanKePos.Tests/WanKePos.Tests.csproj --configuration Release --verbosity normal

      - name: Run Packaging Script
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File .\installer\build_installer.ps1 -Version "${{ env.VERSION }}"

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          name: "万客隆 POS 系统 ${{ env.TAG }}"
          tag_name: ${{ env.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            output_installer/WanKePos_Setup_v${{ env.VERSION }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
