name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - master

jobs:
  test-and-build:
    name: Run Unit Tests & Build Solution
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore WanKePos.sln

      - name: Run Unit Tests
        run: dotnet test tests/WanKePos.Tests/WanKePos.Tests.csproj --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Build Solution
        run: dotnet build WanKePos.sln --configuration Release --no-restore
